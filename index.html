<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>互動裝置展示</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="opening-animation">
        <img src="星球/logo.png" alt="Logo" />
    </div>
    <div class="container">
        <!-- 選單按鈕 -->
        <button class="menu-button">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <!-- 選單內容 -->
        <div class="menu">
            <button class="close-menu">×</button>
            <ul>
                <li><a href="#about">關於我們</a></li>
                <li><a href="#contact">聯絡方式</a></li>
                <li><a href="#help">使用說明</a></li>
            </ul>
            <div class="menu-logo" style="margin-top:60px; display:flex; justify-content:center; align-items:end; height:120px;">
                <img src="星球/logo.png" alt="Logo" style="max-width:220px; max-height:200px; object-fit:contain;">
            </div>
        </div>

        <!-- 區域1：左半展區 -->
        <div id="area1" class="area active">
            <div class="planets-grid">
                <div class="planet" data-booth="5">
                    <img src="星球/planet5.png" alt="展位 5">
                    <div class="planet-info">
                        <h3>展位 5</h3>
                        <p>左上展區</p>
                    </div>
                </div>
                <div class="planet" data-booth="7">
                    <img src="星球/planet7.png" alt="展位 7">
                    <div class="planet-info">
                        <h3>展位 7</h3>
                        <p>左側中間展區</p>
                    </div>
                </div>
                <div class="planet" data-booth="12">
                    <img src="星球/planet12.png" alt="展位 12">
                    <div class="planet-info">
                        <h3>展位 12</h3>
                        <p>左側展區</p>
                    </div>
                </div>
                <div class="planet" data-booth="6">
                    <img src="星球/planet6.png" alt="展位 6">
                    <div class="planet-info">
                        <h3>展位 6</h3>
                        <p>左下展區</p>
                    </div>
                </div>
                <div class="planet" data-booth="2">
                    <img src="星球/planet2.png" alt="展位 2">
                    <div class="planet-info">
                        <h3>展位 2</h3>
                        <p>左側V形展區</p>
                    </div>
                </div>
                <div class="planet" data-booth="9">
                    <img src="星球/planet9.png" alt="展位 9">
                    <div class="planet-info">
                        <h3>展位 9</h3>
                        <p>中央展區</p>
                    </div>
                </div>
                <div class="planet" data-booth="8">
                    <img src="星球/planet8.png" alt="展位 8">
                    <div class="planet-info">
                        <h3>展位 8</h3>
                        <p>中央下方展區</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 區域2：右半展區 -->
        <div id="area2" class="area">
            <div class="planets-grid">
                <div class="planet" data-booth="11">
                    <img src="星球/planet11.png" alt="展位 11">
                    <div class="planet-info">
                        <h3>展位 11</h3>
                        <p>右側V形展區</p>
                    </div>
                </div>
                <div class="planet" data-booth="10">
                    <img src="星球/planet10.png" alt="展位 10">
                    <div class="planet-info">
                        <h3>展位 10</h3>
                        <p>右上展區</p>
                    </div>
                </div>
                <div class="planet" data-booth="3">
                    <img src="星球/planet3.png" alt="展位 3">
                    <div class="planet-info">
                        <h3>展位 3</h3>
                        <p>右側展區</p>
                    </div>
                </div>
                <div class="planet" data-booth="13">
                    <img src="星球/planet13.png" alt="展位 13">
                    <div class="planet-info">
                        <h3>展位 13</h3>
                        <p>右下展區</p>
                    </div>
                </div>
                <div class="planet" data-booth="1">
                    <img src="星球/planet1.png" alt="展位 1">
                    <div class="planet-info">
                        <h3>展位 1</h3>
                        <p>中央主展區</p>
                    </div>
                </div>
                <div class="planet" data-booth="4">
                    <img src="星球/planet4.png" alt="展位 4">
                    <div class="planet-info">
                        <h3>展位 4</h3>
                        <p>中央下方展區</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- 導航控制 -->
        <div class="navigation">
            <div class="dots">
                <span class="dot active"></span>
                <span class="dot"></span>
            </div>
            <button class="next-button">下一區</button>
        </div>

        <!-- 彈窗 -->
        <div class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <div class="booth-info">
                    <img class="intro-image" src="" alt="展位介紹">
                    <h2></h2>
                    <p class="description"></p>
                    <p class="size"></p>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
